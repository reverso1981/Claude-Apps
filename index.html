<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projektaufnahme Touristische Grundstückssuche</title>
<meta name="description" content="Projektaufnahmebogen zur Erfassung von Standortanforderungen für touristische Entwicklungsprojekte.">
<style>
:root{
  --brand:#1f5fa9;
  --brand-dark:#16457a;
  --brand-light:#e8f0fb;
  --accent:#0f9d8f;
  --bg:#f4f6fa;
  --surface:#ffffff;
  --line:#e2e7f0;
  --line-strong:#cbd4e3;
  --text:#1b2433;
  --muted:#5f6b80;
  --faint:#8b96a8;
  --danger:#c0392b;
  --danger-bg:#fdecea;
  --ok:#1e8e5a;
  --warn:#b7791f;
  --radius:14px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(20,35,60,.06),0 1px 3px rgba(20,35,60,.05);
  --shadow:0 2px 6px rgba(20,35,60,.06),0 10px 30px rgba(20,35,60,.07);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit}
a{color:var(--brand)}

/* ---------- Layout ---------- */
.app{max-width:1240px;margin:0 auto;padding:0 20px 64px}

.topbar{
  background:linear-gradient(135deg,#16457a 0%,#1f5fa9 55%,#2b7fc4 100%);
  color:#fff;
  padding:26px 0 22px;
  box-shadow:var(--shadow-sm);
}
.topbar-inner{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{
  width:46px;height:46px;flex:none;border-radius:12px;
  background:rgba(255,255,255,.16);
  display:grid;place-items:center;border:1px solid rgba(255,255,255,.25)
}
.brand-mark svg{width:26px;height:26px;stroke:#fff}
.brand h1{font-size:21px;line-height:1.25}
.brand p{margin:2px 0 0;font-size:13.5px;color:rgba(255,255,255,.82)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid transparent;border-radius:9px;
  padding:9px 14px;font-size:13.5px;font-weight:600;
  cursor:pointer;background:#fff;color:var(--brand-dark);
  transition:.15s ease;white-space:nowrap;
}
.btn svg{width:16px;height:16px;stroke:currentColor;flex:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:none}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.2)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-outline{background:#fff;border-color:var(--line-strong);color:var(--text)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

/* ---------- Progress ---------- */
.progress-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);padding:18px 20px;margin-top:-14px;position:relative;z-index:2;
}
.progress-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.progress-head strong{font-size:14px}
.progress-head span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#e9edf5;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--brand) 0%,var(--accent) 100%);transition:width .35s cubic-bezier(.4,0,.2,1)}
.steplist{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:4px;scrollbar-width:thin}
.steplist button{
  flex:none;border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:99px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:.15s
}
.steplist button:hover{border-color:var(--brand);color:var(--brand)}
.steplist button.active{background:var(--brand);border-color:var(--brand);color:#fff}
.steplist button.done{border-color:#bfe3d2;background:#f0faf5;color:var(--ok)}
.steplist button.done.active{background:var(--brand);border-color:var(--brand);color:#fff}
.steplist .num{font-variant-numeric:tabular-nums;opacity:.75}

/* ---------- Card ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-top:22px;overflow:hidden;
}
.card-head{padding:24px 28px 18px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.card-icon{width:44px;height:44px;flex:none;border-radius:11px;background:var(--brand-light);display:grid;place-items:center}
.card-icon svg{width:23px;height:23px;stroke:var(--brand)}
.card-head h2{font-size:19px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand);margin-bottom:3px}
.card-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:70ch}
.card-body{padding:26px 28px 30px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Fields ---------- */
.grid{display:grid;gap:20px 22px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid .full{grid-column:1/-1}
.field label.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:7px}
.req{color:var(--danger);margin-left:2px}
.hint{display:block;font-weight:400;color:var(--faint);font-size:12.5px;margin-top:2px}
input[type=text],input[type=tel],input[type=email],input[type=number],textarea,select{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  font-size:14.5px;font-family:inherit;color:var(--text);background:#fff;transition:.15s
}
textarea{min-height:130px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,169,.14)}
.invalid input,.invalid textarea,.invalid select,.invalid .optgroup{border-color:var(--danger)!important;background:#fffafa}
.err{display:none;color:var(--danger);font-size:12.5px;margin-top:6px;font-weight:600}
.invalid .err{display:block}

/* option chips (radio / checkbox) */
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opts.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opt{
  display:flex;align-items:center;gap:9px;cursor:pointer;
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);
  padding:9px 13px;font-size:14px;background:#fff;transition:.15s;user-select:none
}
.opt:hover{border-color:var(--brand);background:#fbfcfe}
.opt input{accent-color:var(--brand);width:16px;height:16px;flex:none;margin:0}
.opt.sel{border-color:var(--brand);background:var(--brand-light);color:var(--brand-dark);font-weight:600}
.optgroup{border:1px solid transparent;border-radius:var(--radius-sm)}

/* sliders */
.sliders{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.slider-row{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 15px;background:#fcfdff}
.slider-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.slider-top .name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.slider-top .name svg{width:16px;height:16px;stroke:var(--brand);flex:none}
.pill{
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;
  background:var(--brand-light);color:var(--brand-dark);white-space:nowrap;font-variant-numeric:tabular-nums
}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:22px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--brand) var(--pct,0%),#e4e9f2 var(--pct,0%))}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:#e4e9f2}
input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:var(--brand)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;border:2px solid var(--brand);box-shadow:var(--shadow-sm);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--brand);cursor:pointer}
.scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:2px}

/* matrix */
.matrix{width:100%;border-collapse:collapse;font-size:14px}
.matrix th,.matrix td{padding:11px 12px;text-align:center;border-bottom:1px solid var(--line)}
.matrix th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:#f8fafd}
.matrix th:first-child,.matrix td:first-child{text-align:left;font-weight:600}
.matrix tbody tr:hover{background:#fbfcfe}
.matrix input{accent-color:var(--brand);width:17px;height:17px;cursor:pointer}
.matrix .cellname{display:flex;align-items:center;gap:9px}
.matrix .cellname svg{width:17px;height:17px;stroke:var(--brand);flex:none}
.matrix-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.matrix tbody tr:last-child td{border-bottom:none}

/* section subhead */
.subhead{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:4px 0 12px}
.note{background:#f8fafd;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius-sm);padding:12px 15px;font-size:13.5px;color:var(--muted)}

/* ---------- Footer nav ---------- */
.navbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 28px;border-top:1px solid var(--line);background:#fafbfd;flex-wrap:wrap}
.saved{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
.saved svg{width:14px;height:14px;stroke:var(--ok)}
.nav-actions{display:flex;gap:9px}

/* ---------- Summary ---------- */
.sum-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.sum-card{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff;break-inside:avoid}
.sum-card h3{display:flex;align-items:center;gap:9px;font-size:14.5px;padding:13px 16px;background:#f8fafd;border-bottom:1px solid var(--line)}
.sum-card h3 svg{width:18px;height:18px;stroke:var(--brand)}
.sum-body{padding:6px 16px 12px}
.kv{display:flex;gap:14px;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex:1 1 45%}
.kv .v{font-weight:600;text-align:right;flex:1 1 55%;word-break:break-word}
.kv .v.empty{color:var(--faint);font-weight:400;font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.kv.has-tags{flex-direction:column;align-items:stretch;gap:6px}
.kv.has-tags .k{flex:none}
.kv.has-tags .tags{justify-content:flex-start}
.tag{background:var(--brand-light);color:var(--brand-dark);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.tag.red{background:var(--danger-bg);color:var(--danger)}
.tag.green{background:#eaf7f0;color:var(--ok)}
.tag.amber{background:#fdf5e6;color:var(--warn)}
.rank{display:flex;flex-direction:column;gap:7px;padding:4px 0 8px}
.rank-row{display:grid;grid-template-columns:minmax(120px,1.2fr) 1fr 34px;align-items:center;gap:10px;font-size:13px}
.rank-bar{height:7px;border-radius:99px;background:#eaeef5;overflow:hidden}
.rank-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--accent))}
.rank-val{text-align:right;font-weight:700;font-size:12.5px;color:var(--brand-dark);font-variant-numeric:tabular-nums}
.freetext{background:#f8fafd;border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;font-size:13.5px;white-space:pre-wrap;color:var(--text);margin:4px 0 10px}
.sum-hero{border:1px solid var(--line);border-radius:var(--radius-sm);background:linear-gradient(135deg,#f4f8fd,#fbfcfe);padding:20px 22px;margin-bottom:20px}
.sum-hero h3{font-size:20px;margin-bottom:4px}
.sum-hero p{margin:0;color:var(--muted);font-size:13.5px}
.stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:16px}
.stat .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.stat .val{font-size:16px;font-weight:700;margin-top:2px}

/* ---------- Banner / Toast / Modal ---------- */
.banner{
  display:none;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:#fff8e8;border:1px solid #f0dcae;border-left:4px solid var(--warn);
  border-radius:var(--radius-sm);padding:14px 18px;margin-top:18px;font-size:13.5px
}
.banner.show{display:flex}
.banner .txt{display:flex;gap:11px;align-items:center}
.banner svg{width:20px;height:20px;stroke:var(--warn);flex:none}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);
  background:#1b2433;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;
  box-shadow:0 12px 34px rgba(0,0,0,.25);z-index:99;transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:9px;max-width:90vw
}
.toast.show{transform:translate(-50%,0)}
.toast svg{width:17px;height:17px;stroke:#6ee7b7}
.toast.err svg{stroke:#fca5a5}
.modal{position:fixed;inset:0;background:rgba(19,28,42,.55);display:none;place-items:center;z-index:100;padding:20px}
.modal.show{display:grid}
.modal-box{background:#fff;border-radius:var(--radius);max-width:520px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);overflow:hidden}
.modal-box header{padding:20px 24px 0}
.modal-box h3{font-size:17px}
.modal-box p{color:var(--muted);font-size:14px;padding:0 24px;margin:8px 0 0}
.modal-box footer{display:flex;justify-content:flex-end;gap:9px;padding:20px 24px}

/* ---------- Print ---------- */
@media print{
  @page{margin:14mm}
  body{background:#fff;font-size:11.5pt}
  .topbar{background:#fff;color:#000;border-bottom:2px solid #1f5fa9;padding:0 0 10px;box-shadow:none}
  .brand-mark{display:none}
  .brand h1{font-size:18pt;color:#16457a}
  .brand p{color:#555}
  .toolbar,.steplist,.navbar,.banner,.progress-card,.toast,.modal,.no-print{display:none!important}
  .app{padding:0;max-width:none}
  .card{box-shadow:none;border:none;margin:0}
  .card-head{padding:14px 0 10px}
  .card-body{padding:0;animation:none}
  .card-icon{display:none}
  .sum-grid{grid-template-columns:repeat(2,1fr)}
  .sum-card,.sum-hero{break-inside:avoid;page-break-inside:avoid}
  a{text-decoration:none;color:#000}
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .sliders{grid-template-columns:1fr}
}
@media(max-width:640px){
  body{font-size:14.5px}
  .app{padding:0 13px 48px}
  .topbar-inner{padding:0 13px}
  .brand h1{font-size:18px}
  .card-head,.card-body{padding-left:17px;padding-right:17px}
  .navbar{padding:14px 17px}
  .toolbar{width:100%}
  .toolbar .btn{flex:1 1 auto;justify-content:center}
  .nav-actions{width:100%}
  .nav-actions .btn{flex:1;justify-content:center}
  .navbar{flex-direction:column-reverse;align-items:stretch}
  .saved{justify-content:center}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 20V9l7-5 7 5v11"/><path d="M10 20v-6h4v6"/></svg>
      </div>
      <div>
        <h1>Projektaufnahme Touristische Grundstückssuche</h1>
        <p>Standortanforderungen für touristische Entwicklungsprojekte</p>
      </div>
    </div>
    <div class="toolbar">
      <button class="btn btn-ghost" id="btnDemo" type="button" title="Formular mit Beispielwerten befüllen">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13H11l-1 9 8.5-11H12z"/></svg>Demo-Modus</button>
      <button class="btn btn-ghost" id="btnSummary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M3 6h.01M3 12h.01M3 18h.01"/></svg>Zusammenfassung</button>
      <button class="btn" id="btnJson" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Als JSON exportieren</button>
      <button class="btn" id="btnPrint" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>PDF drucken</button>
      <button class="btn btn-ghost" id="btnReset" type="button" title="Alle Eingaben verwerfen">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Zurücksetzen</button>
    </div>
  </div>
</header>

<main class="app">
  <div class="banner" id="restoreBanner">
    <div class="txt">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <div><strong>Gespeicherter Zwischenstand gefunden.</strong><br><span id="restoreInfo"></span></div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-primary" id="btnRestore" type="button">Wiederherstellen</button>
      <button class="btn btn-outline" id="btnDiscard" type="button">Verwerfen</button>
    </div>
  </div>

  <section class="progress-card" aria-label="Fortschritt">
    <div class="progress-head">
      <strong id="progTitle">Schritt 1 von 15 · Projektstammdaten</strong>
      <span id="progPct">0 % abgeschlossen</span>
    </div>
    <div class="bar"><div class="bar-fill" id="progFill"></div></div>
    <nav class="steplist" id="stepList"></nav>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="card-icon" id="cardIcon"></div>
      <div>
        <div class="eyebrow" id="cardEyebrow">Schritt 1 / 15</div>
        <h2 id="cardTitle"></h2>
        <p id="cardDesc"></p>
      </div>
    </div>
    <form class="card-body" id="cardBody" novalidate></form>
    <div class="navbar no-print">
      <div class="saved" id="savedInfo"></div>
      <div class="nav-actions">
        <button class="btn btn-outline" id="btnPrev" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>Zurück</button>
        <button class="btn btn-primary" id="btnNext" type="button">Weiter
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="modal-box">
    <header><h3 id="modalTitle"></h3></header>
    <p id="modalText"></p>
    <footer>
      <button class="btn btn-outline" id="modalCancel" type="button">Abbrechen</button>
      <button class="btn btn-primary" id="modalOk" type="button">Bestätigen</button>
    </footer>
  </div>
</div>
<script>
(function(){
"use strict";

/* ============================================================
   Icons
   ============================================================ */

/* ============================================================
   State
   ============================================================ */
let state = {};
let current = 0;
let saveTimer = null;
let touched = {};
let visited = {0:true};

const $ = s => document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const allFields = () => STEPS.flatMap(s => s.f);
const fieldByName = n => allFields().find(f => f.n === n);

function defaults(){
  const d = {};
  allFields().forEach(f => {
    if(f.t === "check") d[f.n] = [];
    else if(f.t === "sliders"){ d[f.n] = {}; f.items.forEach(i => d[f.n][i.n] = f.def); }
    else if(f.t === "matrix"){ d[f.n] = {}; f.rows.forEach(r => d[f.n][r.n] = ""); }
    else d[f.n] = "";
  });
  return d;
}
function visible(f){ return !f.showIf || f.showIf(state); }

/* ============================================================
   Rendering: Felder
   ============================================================ */
function renderField(f){
  if(!visible(f)) return "";
  const cls = "field " + (f.w === "half" ? "" : "full");
  const lab = f.l ? '<label class="lbl" for="'+f.n+'">'+esc(f.l)+(f.unit?' <span class="hint" style="display:inline">('+esc(f.unit)+')</span>':"")+(f.req?'<span class="req">*</span>':"")+(f.hint?'<span class="hint">'+esc(f.hint)+'</span>':"")+'</label>' : "";
  const err = '<div class="err" data-err="'+f.n+'">Bitte ausfüllen.</div>';
  let inner = "";

  if(f.t === "text" || f.t === "tel" || f.t === "email" || f.t === "num"){
    const type = f.t === "num" ? "number" : (f.t === "area" ? "text" : f.t);
    inner = '<input type="'+type+'" id="'+f.n+'" name="'+f.n+'" data-f="'+f.n+'" placeholder="'+esc(f.ph||"")+'" value="'+esc(state[f.n])+'"'+(f.t==="num"?' min="0" step="1" inputmode="numeric"':"")+'>';
  } else if(f.t === "area"){
    inner = '<textarea id="'+f.n+'" name="'+f.n+'" data-f="'+f.n+'" placeholder="'+esc(f.ph||"")+'"'+(f.big?' style="min-height:190px"':(f.small?' style="min-height:96px"':""))+'>'+esc(state[f.n])+'</textarea>';
  } else if(f.t === "radio" || f.t === "check"){
    const multi = f.t === "check";
    const val = state[f.n];
    inner = '<div class="optgroup"><div class="opts'+(f.layout==="cols"?" cols":"")+'">'+ f.o.map((o,i) => {
      const sel = multi ? (val||[]).indexOf(o) > -1 : val === o;
      return '<label class="opt'+(sel?" sel":"")+'"><input type="'+(multi?"checkbox":"radio")+'" name="'+f.n+'" value="'+esc(o)+'" data-f="'+f.n+'"'+(sel?" checked":"")+'><span>'+esc(o)+'</span></label>';
    }).join("") + '</div></div>';
  } else if(f.t === "sliders"){
    inner = '<div class="sliders">'+ f.items.map(it => {
      const v = state[f.n][it.n] != null ? state[f.n][it.n] : f.def;
      const pct = ((v - f.min) / (f.max - f.min)) * 100;
      return '<div class="slider-row">'
        + '<div class="slider-top"><span class="name">'+svg(it.icon)+esc(it.l)+'</span>'
        + '<span class="pill" data-pill="'+f.n+'.'+it.n+'">'+v+' – '+WICHTIG[v]+'</span></div>'
        + '<input type="range" min="'+f.min+'" max="'+f.max+'" step="1" value="'+v+'" data-slider="'+f.n+'" data-item="'+it.n+'" style="--pct:'+pct+'%">'
        + '<div class="scale"><span>1 unwichtig</span><span>3</span><span>5 sehr wichtig</span></div></div>';
    }).join("") + '</div>';
  } else if(f.t === "matrix"){
    inner = '<div class="optgroup"><div class="matrix-wrap"><table class="matrix"><thead><tr><th>Kriterium</th>'
      + f.o.map(o => '<th>'+esc(o)+'</th>').join("") + '</tr></thead><tbody>'
      + f.rows.map(r => '<tr><td><span class="cellname">'+svg(r.icon)+esc(r.l)+'</span></td>'
        + f.o.map(o => '<td><input type="radio" name="'+f.n+'__'+r.n+'" value="'+esc(o)+'" data-matrix="'+f.n+'" data-row="'+r.n+'"'+(state[f.n][r.n]===o?" checked":"")+' aria-label="'+esc(r.l+": "+o)+'"></td>').join("")
        + '</tr>').join("")
      + '</tbody></table></div></div>';
  }
  return '<div class="'+cls+'" data-field="'+f.n+'">'+lab+inner+err+'</div>';
}

function renderStep(){
  const st = STEPS[current];
  $("#cardIcon").innerHTML = svg(st.icon);
  $("#cardEyebrow").textContent = "Schritt " + (current+1) + " / " + TOTAL;
  $("#cardTitle").textContent = st.t;
  $("#cardDesc").textContent = st.d;
  const body = $("#cardBody");
  body.innerHTML = st.summary ? renderSummary() : '<div class="grid">' + st.f.map(renderField).join("") + '</div>';
  if(!st.summary && st.f.some(f => f.req)) body.insertAdjacentHTML("beforeend",
    '<div class="note" style="margin-top:22px">Mit <span class="req">*</span> gekennzeichnete Felder sind Pflichtfelder.</div>');
  $("#btnPrev").disabled = current === 0;
  $("#btnNext").innerHTML = current === TOTAL-1
    ? 'Als JSON exportieren <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>'
    : 'Weiter <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  if(touched[current]) validateStep(current, true);
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
}

function updateProgress(){
  const done = STEPS.map((s,i) => i);
  let complete = 0;
  for(let i=0;i<TOTAL;i++) if(stepComplete(i)) complete++;
  const pct = Math.round(complete / TOTAL * 100);
  $("#progFill").style.width = pct + "%";
  $("#progPct").textContent = pct + " % abgeschlossen";
  $("#progTitle").textContent = "Schritt " + (current+1) + " von " + TOTAL + " · " + STEPS[current].t;
  $("#stepList").innerHTML = STEPS.map((s,i) =>
    '<button type="button" data-step="'+i+'" class="'+(i===current?"active ":"")+(stepComplete(i)?"done":"")+'"><span class="num">'+(i+1)+'</span> '+esc(s.short)+'</button>'
  ).join("");
  const el = $("#stepList").querySelector(".active");
  if(el) el.scrollIntoView({block:"nearest", inline:"center", behavior:"smooth"});
}

/* ============================================================
   Validierung
   ============================================================ */
function fieldErrors(f){
  if(!visible(f)) return null;
  const v = state[f.n];
  if(f.t === "check"){ if(f.req && (!v || !v.length)) return "Bitte mindestens eine Option wählen."; return null; }
  if(f.t === "matrix"){ if(f.req && f.rows.some(r => !v[r.n])) return "Bitte für jede Zeile eine Auswahl treffen."; return null; }
  if(f.t === "sliders") return null;
  const s = (v||"").toString().trim();
  if(f.req && !s) return "Dieses Feld ist ein Pflichtfeld.";
  if(!s) return null;
  if(f.t === "email" && !/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(s)) return "Bitte eine gültige E-Mail-Adresse eingeben.";
  if(f.t === "num" && (isNaN(Number(s)) || Number(s) < 0)) return "Bitte eine gültige Zahl eingeben.";
  if(f.n === "groesse_ideal" && state.groesse_min && Number(s) < Number(state.groesse_min)) return "Idealgröße darf nicht kleiner als die Mindestgröße sein.";
  if(f.n === "groesse_max" && state.groesse_ideal && Number(s) < Number(state.groesse_ideal)) return "Maximalgröße darf nicht kleiner als die Idealgröße sein.";
  return null;
}
function hasContent(f){
  const v = state[f.n];
  if(f.t === "check") return !!(v && v.length);
  if(f.t === "matrix") return f.rows.some(r => !!v[r.n]);
  if(f.t === "sliders") return true;
  return !!(v || "").toString().trim();
}
function stepComplete(i){
  const st = STEPS[i];
  if(st.summary) return STEPS.every((s,j) => j === i || stepComplete(j));
  if(!st.f.every(f => !fieldErrors(f))) return false;
  // Schritte ohne Pflichtfelder gelten erst als erledigt, wenn sie besucht oder befüllt wurden
  if(!st.f.some(f => f.req && visible(f))) return !!visited[i] || st.f.some(hasContent);
  return true;
}
function validateStep(i, show){
  const st = STEPS[i];
  let ok = true, first = null;
  st.f.forEach(f => {
    const msg = fieldErrors(f);
    const wrap = $('[data-field="'+f.n+'"]');
    if(msg) ok = false;
    if(show && wrap){
      wrap.classList.toggle("invalid", !!msg);
      const e = wrap.querySelector('[data-err]');
      if(e && msg) e.textContent = msg;
      if(msg && !first) first = wrap;
    }
  });
  if(show && first) first.scrollIntoView({block:"center", behavior:"smooth"});
  return ok;
}

/* ============================================================
   Eingaben
   ============================================================ */
function onInput(e){
  const t = e.target;
  if(t.dataset.f){
    const f = fieldByName(t.dataset.f);
    if(!f) return;
    if(f.t === "check"){
      const set = new Set(state[f.n] || []);
      t.checked ? set.add(t.value) : set.delete(t.value);
      state[f.n] = f.o.filter(o => set.has(o));
      t.closest(".opt").classList.toggle("sel", t.checked);
    } else if(f.t === "radio"){
      state[f.n] = t.value;
      const grp = t.closest(".opts");
      grp.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.querySelector("input").checked));
      if(f.n === "suchgebiet") return afterStructuralChange();
    } else {
      state[f.n] = t.value;
    }
    revalidate(f);
  } else if(t.dataset.matrix){
    state[t.dataset.matrix][t.dataset.row] = t.value;
    revalidate(fieldByName(t.dataset.matrix));
  } else if(t.dataset.slider){
    const f = fieldByName(t.dataset.slider);
    const v = Number(t.value);
    state[f.n][t.dataset.item] = v;
    t.style.setProperty("--pct", ((v - f.min)/(f.max - f.min))*100 + "%");
    const pill = $('[data-pill="'+f.n+'.'+t.dataset.item+'"]');
    if(pill) pill.textContent = v + " – " + WICHTIG[v];
  } else return;
  scheduleSave();
  updateProgress();
}
function revalidate(f){
  const wrap = $('[data-field="'+f.n+'"]');
  if(!wrap || !wrap.classList.contains("invalid")) return;
  const msg = fieldErrors(f);
  wrap.classList.toggle("invalid", !!msg);
  if(msg) wrap.querySelector("[data-err]").textContent = msg;
}
function afterStructuralChange(){ renderStep(); scheduleSave(); }

/* ============================================================
   Speichern / Wiederherstellen
   ============================================================ */
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
function save(){
  try{
    localStorage.setItem(STORE, JSON.stringify({v:1, savedAt:new Date().toISOString(), step:current, visited:visited, data:state}));
    const t = new Date();
    $("#savedInfo").innerHTML = svg("check") + "Automatisch gespeichert um " + t.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"});
  }catch(err){
    $("#savedInfo").textContent = "Speichern im Browser nicht möglich.";
  }
}
function loadSaved(){
  try{ const raw = localStorage.getItem(STORE); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function applySaved(s){
  state = Object.assign(defaults(), s.data || {});
  allFields().forEach(f => {
    if(f.t === "check" && !Array.isArray(state[f.n])) state[f.n] = [];
    if((f.t === "sliders" || f.t === "matrix") && (!state[f.n] || typeof state[f.n] !== "object")) state[f.n] = defaults()[f.n];
  });
  visited = Object.assign({0:true}, s.visited || {});
  current = Math.min(Math.max(0, s.step|0), TOTAL-1);
  visited[current] = true;
  renderStep();
}

/* ============================================================

   ============================================================ */
function splitList(s){
  return (s||"").split(/[\n,;]+/).map(x => x.trim()).filter(Boolean);
}
function num(v){ const n = Number(v); return v === "" || isNaN(n) ? null : n; }

function buildJSON(){
  let complete = 0; for(let i=0;i<TOTAL;i++) if(stepComplete(i)) complete++;
  return {
    meta:{
      formular:"Projektaufnahme Touristische Grundstückssuche",
      version:"1.0",
      erstellt_am:new Date().toISOString(),
      fortschritt_prozent:Math.round(complete/TOTAL*100)
    },
    projektname:state.projektname || "",
    unternehmen:state.unternehmen || "",
    ansprechpartner:{ name:state.ansprechpartner || "", telefon:state.telefon || "", email:state.email || "" },
    projektstatus:state.projektstatus || "",
    projektart:state.projektart || [],
    kurzbeschreibung:state.kurzbeschreibung || "",
    grundstuecksgroesse:{
      mindestgroesse_m2:num(state.groesse_min),
      idealgroesse_m2:num(state.groesse_ideal),
      maximalgroesse_m2:num(state.groesse_max),
      erweiterungsflaechen:state.erweiterungsflaechen || "",
      bebauungsgrad:state.bebauungsgrad || ""
    },
    region:{
      suchgebiet:state.suchgebiet || "",
      bezirke:state.suchgebiet === "Ganz Oberösterreich" ? BEZIRKE.slice() : (state.bezirke || []),
      bevorzugte_gemeinden:splitList(state.bevorzugte_gemeinden),
      ausgeschlossene_gemeinden:splitList(state.ausgeschlossene_gemeinden),
      max_suchradius_km:num(state.suchradius)
    },
    lageanforderungen:Object.assign({}, state.lageanforderungen),
    verkehrsanbindung:{
      max_entfernung_autobahn:state.entfernung_autobahn || "",
      max_entfernung_bahnhof:state.entfernung_bahnhof || "",
      oeffentlicher_verkehr:state.oeffentlicher_verkehr || "",
      busanbindung_erforderlich:state.busanbindung || ""
    },
    infrastruktur:Object.assign({}, state.infrastruktur),
    widmung:{
      bevorzugte_widmungen:state.widmungen || [],
      umwidmung_zulaessig:state.umwidmung || "",
      sofortige_baureife_wichtigkeit:state.baureife ? state.baureife.sofortige_baureife : null
    },
    grundstueckstyp:{
      bevorzugter_typ:state.grundstueckstyp || "",
      bestehende_gebaeude:state.bestehende_gebaeude || "",
      abbruchobjekte_akzeptabel:state.abbruchobjekte || ""
    },
    entwicklungsbereitschaft:{
      verkaufsbereitschaft_erforderlich:state.verkaufsbereitschaft || "",
      gemeindeunterstuetzung_erforderlich:state.gemeindeunterstuetzung || "",
      zusammenarbeit_gemeinde:state.zusammenarbeit_gemeinde || ""
    },
    risiken:Object.assign({}, state.risiken),
    wirtschaftliche_rahmenbedingungen:{
      investitionsvolumen:state.investitionsvolumen || "",
      realisierungszeitraum:state.realisierungszeitraum || ""
    },
    ausschlusskriterien:state.ausschlusskriterien || "",
    erfolgsdefinition:state.erfolgsdefinition || ""
  };
}

function exportJSON(){
  const data = buildJSON();
  const name = (state.projektname || "projektaufnahme").toString().trim()
    .replace(/[^\wäöüÄÖÜß\- ]+/g,"").replace(/\s+/g,"_").toLowerCase() || "projektaufnahme";
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name + "_" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast("JSON-Datei wurde exportiert.");
}

/* ============================================================
   Management Summary
   ============================================================ */
function kv(k, v, cls){
  const empty = v === null || v === undefined || v === "" || (Array.isArray(v) && !v.length);
  let out;
  if(Array.isArray(v) && !empty) out = '<span class="tags">' + v.map(x => '<span class="tag '+(cls||"")+'">'+esc(x)+'</span>').join("") + '</span>';
  else out = '<span class="v'+(empty?" empty":"")+'">' + (empty ? "keine Angabe" : esc(v)) + '</span>';
  const many = Array.isArray(v) && !empty && (v.length > 2 || v.join("").length > 26);
  return '<div class="kv'+(many?" has-tags":"")+'"><span class="k">'+esc(k)+'</span>'+out+'</div>';
}
function card(title, icon, inner){
  return '<div class="sum-card"><h3>'+svg(icon)+esc(title)+'</h3><div class="sum-body">'+inner+'</div></div>';
}
function ranking(obj, limit){
  const items = Object.entries(obj||{}).map(([k,v]) => {
    const f = STEPS[4].f[0].items.find(i => i.n === k);
    return {l:f ? f.l : k, v:Number(v)||0};
  }).sort((a,b) => b.v - a.v);
  const list = limit ? items.slice(0, limit) : items;
  return '<div class="rank">' + list.map(i =>
    '<div class="rank-row"><span>'+esc(i.l)+'</span><span class="rank-bar"><i style="width:'+(i.v/5*100)+'%"></i></span><span class="rank-val">'+i.v+'/5</span></div>'
  ).join("") + '</div>';
}
function matrixTags(fieldName, mapCls){
  const f = fieldByName(fieldName);
  return f.rows.map(r => {
    const v = state[fieldName][r.n];
    return '<div class="kv"><span class="k">'+esc(r.l)+'</span>' +
      (v ? '<span class="tags"><span class="tag '+(mapCls[v]||"")+'">'+esc(v)+'</span></span>' : '<span class="v empty">keine Angabe</span>') + '</div>';
  }).join("");
}
function fmt(n){ const x = num(n); return x === null ? "" : x.toLocaleString("de-AT") + " m²"; }

function renderSummary(){
  const d = buildJSON();
  const lage = state.lageanforderungen || {};
  const topLage = Object.entries(lage).filter(([,v]) => v >= 4).map(([k]) => {
    const it = STEPS[4].f[0].items.find(i => i.n === k); return it ? it.l : k;
  });
  const ko = (fieldByName("risiken").rows || []).filter(r => state.risiken[r.n] === "KO-Kriterium").map(r => r.l);
  const muss = (fieldByName("infrastruktur").rows || []).filter(r => state.infrastruktur[r.n] === "Muss vorhanden").map(r => r.l);
  let complete = 0; for(let i=0;i<TOTAL;i++) if(stepComplete(i)) complete++;

    + '<h3>' + esc(state.projektname || "Unbenanntes Projekt") + '</h3>'

      + '<div class="stat"><div class="lab">Vollständigkeit</div><div class="val">' + Math.round(complete/TOTAL*100) + ' %</div></div>'
    + '</div></div>';

    + kv("Zwingend erforderlich", muss, "red"));

  const risiko = card("Risikoprofil","alert",
      matrixTags("risiken", {"KO-Kriterium":"red","Stark negativ":"amber","Neutral":"green"})
    + kv("KO-Kriterien", ko, "red")
    + (state.ausschlusskriterien ? '<div class="subhead" style="margin-top:12px">Ausschlusskriterien</div><div class="freetext">'+esc(state.ausschlusskriterien)+'</div>' : ""));

  const suche = card("Suchprofil","target",
      kv("Bevorzugte Widmungen", state.widmungen)
    + kv("Umwidmung zulässig", state.umwidmung)
    + kv("Sofortige Baureife", (state.baureife && state.baureife.sofortige_baureife) ? state.baureife.sofortige_baureife + "/5 – " + WICHTIG[state.baureife.sofortige_baureife] : "")

    + kv("Gemeindeunterstützung", state.gemeindeunterstuetzung)
    + kv("Zusammenarbeit mit Gemeinde", state.zusammenarbeit_gemeinde)
    + (state.erfolgsdefinition ? '<div class="subhead" style="margin-top:12px">Erfolgsdefinition</div><div class="freetext">'+esc(state.erfolgsdefinition)+'</div>' : ""));

  const missing = STEPS.map((s,i) => stepComplete(i) ? null : (i+1) + ". " + s.t).filter(Boolean);
  const hinweis = missing.length
    ? '<div class="note" style="margin-top:20px"><strong>Noch offen:</strong> ' + esc(missing.join(" · ")) + '</div>'
    : '<div class="note" style="margin-top:20px;border-left-color:var(--ok)"><strong>Alle Pflichtangaben vollständig.</strong> Der Aufnahmebogen kann exportiert und für die KI-gestützte Standortsuche übergeben werden.</div>';

  return hero + '<div class="sum-grid">' + projekt + standort + infra + risiko + suche + '</div>' + hinweis;
}

  Object.keys(touched).forEach(k => delete touched[k]);
  visited = {}; STEPS.forEach((s,i) => visited[i] = true);
  current = 0;
  renderStep(); save();
  toast("Demo-Daten wurden geladen.");
}

/* ============================================================
   UI-Helfer
   ============================================================ */
let toastTimer = null;
function toast(msg, isErr){
  const el = $("#toast");
  el.innerHTML = svg(isErr ? "alert" : "check") + "<span>" + esc(msg) + "</span>";
  el.classList.toggle("err", !!isErr);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}
let modalCb = null;
function confirmBox(title, text, cb){
  $("#modalTitle").textContent = title;
  $("#modalText").textContent = text;
  modalCb = cb;
  $("#modal").classList.add("show");
}
function closeModal(){ $("#modal").classList.remove("show"); modalCb = null; }

function goto(i, validateForward){
  if(validateForward && i > current && !STEPS[current].summary){
    touched[current] = true;
    if(!validateStep(current, true)){ toast("Bitte alle Pflichtfelder ausfüllen.", true); return; }
  }
  current = Math.min(Math.max(0, i), TOTAL-1);
  visited[current] = true;
  renderStep(); scheduleSave();
}

/* ============================================================
   Events
   ============================================================ */
$("#cardBody").addEventListener("input", onInput);
$("#cardBody").addEventListener("change", onInput);
$("#cardBody").addEventListener("submit", e => e.preventDefault());
$("#stepList").addEventListener("click", e => {
  const b = e.target.closest("button[data-step]");
  if(b) goto(Number(b.dataset.step), false);
});
$("#btnPrev").addEventListener("click", () => goto(current-1, false));
$("#btnNext").addEventListener("click", () => {
  if(current === TOTAL-1){ exportJSON(); return; }
  goto(current+1, true);
});
$("#btnSummary").addEventListener("click", () => goto(TOTAL-1, false));
$("#btnJson").addEventListener("click", exportJSON);
$("#btnPrint").addEventListener("click", () => {
  goto(TOTAL-1, false);
  setTimeout(() => window.print(), 350);
});
$("#btnDemo").addEventListener("click", () => {
  confirmBox("Demo-Modus starten", "Das Formular wird mit vollständigen Beispieldaten befüllt. Bestehende Eingaben werden überschrieben.", fillDemo);
});
$("#btnReset").addEventListener("click", () => {
  confirmBox("Formular zurücksetzen", "Alle Eingaben und der gespeicherte Zwischenstand werden gelöscht. Dieser Vorgang kann nicht rückgängig gemacht werden.", () => {
    try{ localStorage.removeItem(STORE); }catch(e){}
    state = defaults(); current = 0;
    visited = {0:true};
    Object.keys(touched).forEach(k => delete touched[k]);
    $("#savedInfo").textContent = "";
    renderStep();
    toast("Formular wurde zurückgesetzt.");
  });
});
$("#modalOk").addEventListener("click", () => { const cb = modalCb; closeModal(); if(cb) cb(); });
$("#modalCancel").addEventListener("click", closeModal);
$("#modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeModal();
  if(e.altKey && e.key === "ArrowRight"){ e.preventDefault(); goto(current+1, true); }
  if(e.altKey && e.key === "ArrowLeft"){ e.preventDefault(); goto(current-1, false); }
});
window.addEventListener("beforeunload", () => { clearTimeout(saveTimer); save(); });

/* ============================================================
   Init
   ============================================================ */
state = defaults();
renderStep();
const saved = loadSaved();
if(saved && saved.data){
  const dt = saved.savedAt ? new Date(saved.savedAt) : null;
  const name = saved.data.projektname ? '„' + saved.data.projektname + '“' : "ohne Projektnamen";
  $("#restoreInfo").textContent = "Stand " + name + (dt ? " vom " + dt.toLocaleDateString("de-AT") + " um " + dt.toLocaleTimeString("de-AT",{hour:"2-digit",minute:"2-digit"}) + " Uhr" : "") + " – Formular wiederherstellen?";
  $("#restoreBanner").classList.add("show");
  $("#btnRestore").addEventListener("click", () => {
    applySaved(saved);
    $("#restoreBanner").classList.remove("show");
    toast("Gespeicherter Stand wurde wiederhergestellt.");
  });
  $("#btnDiscard").addEventListener("click", () => {
    try{ localStorage.removeItem(STORE); }catch(e){}
    $("#restoreBanner").classList.remove("show");
    toast("Gespeicherter Stand wurde verworfen.");
  });
}
})();
</script>
</body>
</html>
